[package]
name = "lv-mdb-tools"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mdb-flow-test"
path = "src/bin/mdb_flow_test.rs"

[[bin]]
name = "lv-kiosk"
path = "src/bin/lv_kiosk.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.3"
ctrlc = "3.5.2"
hex = "0.4.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "image-without-codecs", "thread-pool", "tiny-skia", "tokio", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nix = { version = "0.31.3", features = ["poll", "term"] }
parse_int = "0.9.0"
redb = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-serial = { version = "5", default-features = false }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
nursery = "deny"
pedantic = "deny"
missing_const_for_fn = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
