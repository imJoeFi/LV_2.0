[workspace]
resolver = "2"
members = [
    "apps/lv-kiosk",
    "apps/lv-manager",
    "crates/lv-core",
    "crates/lv-mdb",
    "crates/lv-vendimint",
    "tools/lv-e2e-tests",
    "tools/mdb-flow-test",
]
default-members = [
    "apps/lv-kiosk",
    "apps/lv-manager",
    "tools/mdb-flow-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
bitcoin = "0.32.8"
chrono = "0.4.45"
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.3"
ctrlc = "3.5.2"
devimint = "=0.11.1"
ed25519 = "=3.0.0-rc.2"
fedimint-core = "0.11.1"
fedimint-lnv2-common = "0.11.1"
fedimint-lnv2-remote-client = "0.0.7"
hex = "0.4.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "image-without-codecs", "qr_code", "thread-pool", "tiny-skia", "tokio", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iroh = "0.97.0"
lightning-invoice = "0.33.3"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
lv-core = { path = "crates/lv-core" }
lv-mdb = { path = "crates/lv-mdb" }
lv-vendimint = { path = "crates/lv-vendimint" }
nix = { version = "0.31.3", features = ["poll", "term"] }
parse_int = "0.9.0"
pkcs8 = "=0.11.0-rc.11"
redb = "4.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rqrr = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5.10", features = ["all"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-serial = { version = "5", default-features = false }
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
vendimint = { git = "https://github.com/lightningvend/vendimint.git", rev = "97eaf87fceba02de5b4e54ad3887d3cbffbbfe9b" }
zeroize = { version = "1", features = ["derive"] }

[workspace.dependencies.nokhwa]
version = "0.10.11"
default-features = false
features = ["decoding", "input-native"]

[workspace.lints.clippy]
nursery = "deny"
pedantic = "deny"
missing_const_for_fn = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
